# Nginx / Nginx Proxy Manager (NPM) Advanced Configuration for ResearchOps
# Paste this block into the "Advanced" tab of the Proxy Host in Nginx Proxy Manager.

# Security Headers
add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "same-origin" always;
# ResearchOps sets route-specific CSP, including restrictive preview/artifact
# policies. Preserve those headers; do not replace them with a global CSP.

# Prevent Direct File Exposure and Force Request Limits
client_max_body_size 2m;
client_body_buffer_size 128k;

# Proxy Forwarding Headers
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host $host;
proxy_set_header X-Forwarded-Port $server_port;
proxy_set_header Forwarded "";
# The application authenticates the user; an optional NPM Basic gate can add
# an outer access policy. Bootstrap and login use the TLS proxy endpoint.
# Basic credentials never belong in the application or worker environment.
proxy_set_header Authorization "";

# Disable Buffering for Realtime Polling
proxy_buffering off;
proxy_read_timeout 30s;
proxy_connect_timeout 10s;
proxy_send_timeout 30s;
