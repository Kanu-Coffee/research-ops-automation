name: Verify stable release
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        python: ['3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: '0.12.5'
      - run: uv sync --frozen --python "${{ matrix.python }}"
      - run: uv run --frozen python -m unittest discover -s tests -v
      - run: uv run --frozen python -m compileall -q researchops
      - run: shellcheck bin/*.sh
      - run: uv run --frozen python scripts/release_check.py
      - run: sha256sum --check --strict CHECKSUMS.sha256
      - run: uv build --no-sources
      - name: Verify installed wheel outside checkout
        shell: bash
        run: |
          uv export --frozen --no-dev --no-emit-project --format requirements-txt --output-file "$RUNNER_TEMP/researchops-requirements.txt"
          uv venv --python "${{ matrix.python }}" "$RUNNER_TEMP/researchops-wheel"
          uv pip install --python "$RUNNER_TEMP/researchops-wheel/bin/python" --require-hashes -r "$RUNNER_TEMP/researchops-requirements.txt"
          uv pip install --python "$RUNNER_TEMP/researchops-wheel/bin/python" --no-deps dist/researchops-*.whl
          uv pip check --python "$RUNNER_TEMP/researchops-wheel/bin/python"
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/researchops-wheel/bin/researchctl" version --json
          "$RUNNER_TEMP/researchops-wheel/bin/researchctl" validate-runners --runner fake --json
